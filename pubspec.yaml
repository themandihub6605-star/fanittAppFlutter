# File: pubspec.yaml
name: fanitt
description: Fanitt — the creator, brand and agency app.
publish_to: 'none'
version: 1.0.0+26

environment:
  sdk: ^3.7.0

dependencies:
  flutter:
    sdk: flutter

  # State management
  flutter_bloc: ^9.1.1
  equatable: ^2.0.7

  # Navigation
  go_router: ^16.0.0
  package_info_plus: 9.0.1
  in_app_update: ^4.2.5
  image_cropper: ^12.2.1

  # Networking & storage
  dio: ^5.8.0+1
  flutter_secure_storage: ^9.2.4
  shared_preferences: ^2.3.3
  livekit_client: ^2.4.0
  wakelock_plus: ^1.5.2
  flutter_webrtc: ^1.6.2+hotfix.4

  # Dependency injection
  get_it: ^8.0.3

  # UI
  google_fonts: ^6.2.1
  phosphor_flutter: ^2.1.0
  flutter_animate: ^4.5.2
  cached_network_image: ^3.4.1
  video_player: ^2.9.2
  intl: ^0.20.2
  in_app_review: ^2.0.12

  # Payments, media, realtime & system
  razorpay_flutter: ^1.4.0
  image_picker: ^1.1.2
  file_picker: ^8.1.4
  mime: ^2.0.0
  socket_io_client: ^2.0.3+1
  url_launcher: ^6.3.1
  share_plus: ^10.1.4

  # Firebase (Google sign-in)
  firebase_core: ^3.13.0
  firebase_auth: ^5.5.0
  firebase_messaging: ^15.2.5
  flutter_local_notifications: ^18.0.1
  visibility_detector: ^0.4.0+2
  google_sign_in: ^6.2.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  # App icon generator — run: dart run flutter_launcher_icons
  flutter_launcher_icons: ^0.14.3
  flutter_native_splash: ^2.4.7

flutter:
  uses-material-design: true
  assets:
    - assets/images/appLogo.png
    - assets/images/google.png
    - assets/images/splash_screenlogo.png
    - assets/images/apple.png
    - assets/images/fanitt_wordmark.png
    - assets/images/fanitt_logo_white.png

# App icon: splash gradient (#F4511E → #EC2A78) with the white Fanitt mark.
flutter_launcher_icons:
  # Android — replaces the default ic_launcher icons
  android: true
  min_sdk_android: 21
  image_path_android: "assets/icon/app_icon.png"
  # Adaptive icon (Android 8+): gradient layer + white mark layer
  adaptive_icon_background: "assets/icon/app_icon_background.png"
  adaptive_icon_foreground: "assets/icon/app_icon_foreground.png"
  # Android 13+ themed icons use the white mark only
  adaptive_icon_monochrome: "assets/icon/app_icon_foreground.png"

  # iOS — full square icon, no transparency (App Store rule)
  ios: true
  image_path_ios: "assets/icon/app_icon.png"
  remove_alpha_ios: true