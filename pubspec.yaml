name: fanitt
description: Fanitt — the creator, brand and agency app.
publish_to: 'none'
version: 1.0.0+12

environment:
  sdk: ^3.7.0

dependencies:
  flutter:
    sdk: flutter

  # State management
  flutter_bloc: ^9.1.1
  equatable: ^2.0.7

  # Navigation
  go_router: ^16.0.0
  package_info_plus: 9.0.1

  # Networking & storage
  dio: ^5.8.0+1
  flutter_secure_storage: ^9.2.4
  shared_preferences: ^2.3.3

  # Dependency injection
  get_it: ^8.0.3

  # UI
  google_fonts: ^6.2.1
  phosphor_flutter: ^2.1.0
  flutter_animate: ^4.5.2
  cached_network_image: ^3.4.1
  video_player: ^2.9.2
  intl: ^0.20.2

  # Payments, media, realtime & system
  razorpay_flutter: ^1.4.0
  image_picker: ^1.1.2
  file_picker: ^8.1.4
  mime: ^2.0.0
  socket_io_client: ^2.0.3+1
  url_launcher: ^6.3.1
  share_plus: ^10.1.4

  # Firebase (Google sign-in)
  firebase_core: ^3.13.0
  firebase_auth: ^5.5.0
  firebase_messaging: ^15.2.5
  flutter_local_notifications: ^18.0.1
  visibility_detector: ^0.4.0+2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/appLogo.png
    - assets/images/google.png
    - assets/images/splash_screenlogo.png